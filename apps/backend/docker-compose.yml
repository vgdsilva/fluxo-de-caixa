# PostgreSQL local para desenvolvimento: docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: fluxo-de-caixa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluxo_de_caixa
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
